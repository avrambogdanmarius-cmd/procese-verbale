name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Pachete Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Aplicatia web
        run: |
          npm install
          npm run build

      - name: Proiect Android
        run: |
          rm -rf android
          npx cap add android
          node scripts/patch-android.mjs

      - name: Cheie de semnare
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pvauto-release.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "NEW_KEY=0" >> $GITHUB_ENV
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore pvauto-release.jks -alias pvauto -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=PV Auto, O=Electroglobal SA, L=Cluj-Napoca, C=RO"
            mkdir -p ../cheie
            cp pvauto-release.jks ../cheie/
            base64 -w0 pvauto-release.jks > ../cheie/KEYSTORE_BASE64.txt
            echo -n "$PASS" > ../cheie/KEYSTORE_PASSWORD.txt
            echo "NEW_KEY=1" >> $GITHUB_ENV
          fi
          printf "storeFile=pvauto-release.jks\nstorePassword=%s\nkeyAlias=pvauto\nkeyPassword=%s\n" "$PASS" "$PASS" > keystore.properties

      - name: Compilare APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../PV-Auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PV-Auto-apk
          path: PV-Auto.apk

      - uses: actions/upload-artifact@v4
        if: env.NEW_KEY == '1'
        with:
          name: CHEIE-SEMNARE-pastrati-o
          path: cheie/
